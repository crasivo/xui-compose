name: Build & Publish 3X-UI images (Manual)

on:
  workflow_dispatch:
    inputs:
      buildx_action:
        description: 'Build releases (prev/latest/collection)'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run build script
        run: |
          ./bin/buildx-debian.sh ${{ github.event.inputs.buildx_action }} --push --github --dockerhub;
          ./bin/buildx-alpine.sh ${{ github.event.inputs.buildx_action }} --push --github --dockerhub;
